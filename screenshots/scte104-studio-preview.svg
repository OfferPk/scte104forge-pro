<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b13"/>
      <stop offset="100%" stop-color="#0c1422"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121e33"/>
      <stop offset="100%" stop-color="#09101c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg)" />

  <!-- Studio Frame -->
  <rect x="30" y="30" width="1140" height="640" rx="12" fill="#080e1a" stroke="#1e3152" stroke-width="2" />

  <!-- Window Header -->
  <rect x="30" y="30" width="1140" height="52" rx="12" fill="#09111e" />
  <circle cx="60" cy="56" r="7" fill="#ff5f56" />
  <circle cx="85" cy="56" r="7" fill="#ffbd2e" />
  <circle cx="110" cy="56" r="7" fill="#27c93f" />

  <!-- Title -->
  <text x="140" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="bold">
    🎬 SCTE104Forge Pro v1.0.0 — ANSI/SCTE 104 &amp; SMPTE ST 2010 Ad Insertion Studio
  </text>
  <rect x="990" y="44" width="160" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
  <text x="1005" y="62" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">10/10 PASS • CERTIFIED</text>

  <!-- Nav Tabs -->
  <rect x="50" y="102" width="1100" height="42" rx="8" fill="#070e1a" stroke="#1e3152" stroke-width="1" />
  <rect x="54" y="106" width="240" height="34" rx="6" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.5" />
  <text x="75" y="128" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">1. SCTE 104 Builder</text>
  
  <text x="330" y="128" fill="#8ea2c0" font-family="-apple-system, sans-serif" font-size="13">2. Binary Packet &amp; VANC ST 2010</text>
  <text x="610" y="128" fill="#8ea2c0" font-family="-apple-system, sans-serif" font-size="13">3. SCTE-35 Upstream Translator</text>
  <text x="890" y="128" fill="#8ea2c0" font-family="-apple-system, sans-serif" font-size="13">4. 10-Point Normative Auditor</text>

  <!-- Main Card: Studio Dashboard -->
  <rect x="50" y="162" width="1100" height="485" rx="10" fill="url(#cardGrad)" stroke="#1e3152" stroke-width="1" />

  <!-- Left Column: Builder Controls -->
  <rect x="75" y="185" width="480" height="435" rx="8" fill="#09111e" stroke="#162744" stroke-width="1.5" />
  <text x="95" y="215" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">Automation Splice Cue Parameters</text>
  <text x="95" y="235" fill="#64748b" font-family="monospace" font-size="11">ANSI/SCTE 104 2022 • Pre-Roll &amp; Break Duration</text>

  <!-- Form Fields Mock -->
  <rect x="95" y="255" width="440" height="50" rx="6" fill="#0d182a" stroke="#203860" stroke-width="1" />
  <text x="110" y="275" fill="#94a3b8" font-family="monospace" font-size="11">Splice Event ID (32-bit):</text>
  <text x="110" y="293" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">1001 (0x000003E9)</text>

  <rect x="95" y="315" width="440" height="50" rx="6" fill="#0d182a" stroke="#203860" stroke-width="1" />
  <text x="110" y="335" fill="#94a3b8" font-family="monospace" font-size="11">Pre-Roll Time / Lead Window:</text>
  <text x="110" y="353" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">4000 ms (4.0s Broadcast Standard)</text>

  <!-- Segmentation & Duration Box -->
  <rect x="95" y="375" width="440" height="175" rx="6" fill="#080f1b" stroke="#182c4e" stroke-width="1" />
  <text x="110" y="400" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">Break &amp; Segmentation Descriptors:</text>

  <rect x="110" y="415" width="410" height="26" rx="4" fill="#0c1728" stroke="#0284c7" stroke-width="1" />
  <text x="120" y="432" fill="#38bdf8" font-family="monospace" font-size="11">Duration: 30.0s (300 tenths) • Auto-Return: 1</text>

  <rect x="110" y="450" width="410" height="26" rx="4" fill="#0c1728" stroke="#f59e0b" stroke-width="1" />
  <text x="120" y="467" fill="#f59e0b" font-family="monospace" font-size="11">Type 0x30: Provider Advertisement Start (National Spot)</text>

  <rect x="110" y="485" width="410" height="26" rx="4" fill="#0c1728" stroke="#059669" stroke-width="1" />
  <text x="120" y="502" fill="#10b981" font-family="monospace" font-size="11">UPID: AD_PROD_SPOT_1001 (Type 0x09 ADI)</text>

  <rect x="110" y="520" width="410" height="20" rx="4" fill="#0c1728" />
  <text x="120" y="534" fill="#64748b" font-family="monospace" font-size="10">Operation: 0x0101 (splice_request_data) • 19 Bytes</text>

  <rect x="95" y="565" width="440" height="38" rx="6" fill="#06b6d4" />
  <text x="315" y="589" fill="#04101e" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⚡ Build SCTE 104 Cue Message</text>

  <!-- Right Column: Status & Translated SCTE 35 -->
  <rect x="580" y="185" width="545" height="435" rx="8" fill="#09111e" stroke="#162744" stroke-width="1.5" />
  <text x="600" y="215" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">Playout Cue Armed &amp; SCTE-35 Translation</text>
  <text x="600" y="235" fill="#64748b" font-family="monospace" font-size="11">SMPTE ST 2010 VANC Line 12 • Base64 Downstream Cue</text>

  <!-- Playout Lamp Card -->
  <rect x="600" y="250" width="505" height="70" rx="6" fill="#0d1726" stroke="#1f365d" stroke-width="1" />
  <circle cx="630" cy="285" r="12" fill="#ef4444" stroke="#f87171" stroke-width="2" filter="drop-shadow(0 0 8px rgba(239,68,68,0.8))" />
  <text x="655" y="280" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">AUTOMATION DPI TRIGGER ARMED</text>
  <text x="655" y="298" fill="#94a3b8" font-family="sans-serif" font-size="11">Pre-Roll 4000ms Countdown • Next Commercial: Event #1001</text>

  <!-- Binary & VANC Hex Dump -->
  <rect x="600" y="335" width="505" height="110" rx="6" fill="#070d18" stroke="#182c4e" stroke-width="1" />
  <text x="615" y="358" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">SCTE 104 Wire Bytes (19 Bytes) &amp; ST 2010 VANC Line 12:</text>
  <text x="615" y="380" fill="#38bdf8" font-family="monospace" font-size="11">01 01 00 0F 01 00 00 03 E9 00 01 0F A0 01 2C 01 01 01 00</text>
  <text x="615" y="402" fill="#f59e0b" font-family="monospace" font-size="10">VANC Header: 0x000 0x3FF 0x3FF 0x141 (DID 0x41) 0x207 (SDID 0x07) 0x13</text>
  <text x="615" y="420" fill="#64748b" font-family="monospace" font-size="10">TCP Automation Port: 5167 • Master Control Socket Ready</text>

  <!-- Translated SCTE 35 Box -->
  <rect x="600" y="460" width="505" height="145" rx="6" fill="#0a1626" stroke="#10b981" stroke-width="1.5" />
  <text x="615" y="485" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">Translated ANSI/SCTE 35 Downstream Cue:</text>
  <text x="615" y="508" fill="#ffffff" font-family="monospace" font-size="11">Base64: /DA4AAAA+QAAAAAB/wD/AAAAAAPE6QAAAAAAA...</text>
  <text x="615" y="530" fill="#38bdf8" font-family="monospace" font-size="11">table_id: 0xFC • splice_insert (0x05) • PTS Offset: +4.0s (360,000 ticks)</text>
  <text x="615" y="552" fill="#e2e8f0" font-family="monospace" font-size="11">Break Duration: 30.0s (2,700,000 ticks) • Auto-Return: 1</text>
  <text x="615" y="574" fill="#10b981" font-family="monospace" font-size="11">MPEG-2 CRC-32: 0x5D84A12B (Checksum Verified)</text>
</svg>
